[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expertkit-proto"
version = "0.1.0"
description = "Generated Python bindings for Expert Kit protocols"
requires-python = ">=3.12"
dependencies = [
    "grpcio==1.71.0",
    "protobuf==5.29.6",
]

[tool.ruff]
extend = "../pyproject.toml"
