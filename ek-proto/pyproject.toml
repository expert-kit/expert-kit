[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expertkit-proto"
version = "0.1.0"
description = "Generated Python bindings for Expert Kit protocols"
requires-python = ">=3.12"
dependencies = [
    "grpcio==1.71.0",
    "protobuf==5.29.4",
]

[dependency-groups]
dev = [
    "grpcio-tools==1.71.0",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["src/expertkit_proto"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
