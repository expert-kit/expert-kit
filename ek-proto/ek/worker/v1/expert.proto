syntax = "proto3";
package ek.worker.v1;

import "ek/object/v1/object.proto";

message ForwardReq {
  string instance_id = 1;

  // dimension: [num_experts, seq * batch]
  message ExpertsInfo { repeated bool activation = 2; }
  repeated ExpertsInfo experts = 2;

  string model_name = 3;
  string layer_id = 4;

  // dimension: [seq * batch, dim]
  bytes tensor = 5;
}

message ForwardResp {
  // dimension: [seq, topk,dim]
  bytes output_tensor = 1;
}

message WorkerReq {
  string instance_id = 1;
  string expert_id = 2;
  bytes tensor = 3;
}

service ComputationService {
  rpc Forward(ForwardReq) returns (ForwardResp);
  // TODO: Batch Forward
}

message ExpertState {
  enum Stage {
    STAGE_UNSPECIFIED = 0;
    STAGE_ACTIVE = 1;
    STAGE_LOADING = 2;
    STAGE_EVICTING = 3;
  }
  Stage stage = 1;
}

message RdmaEndpoint {
  string qp_endpoint = 1;   // JSON-serialized QueuePairEndpoint
  string memory_region = 2; // JSON-serialized RemoteMemoryRegion
}

message RdmaEndpointPair {
  RdmaEndpoint request_endpoint = 1;  // For request queue
  RdmaEndpoint response_endpoint = 2; // For response queue
}

message ExchangeReq {
  string id = 1;
  string addr = 2;
  string channel = 3;
  string device = 4;
  bool last_will = 5;
  RdmaEndpointPair rdma_endpoints = 6;
}

message ExchangeResp {
  message ExpertWithState { ek.object.v1.ExpertSlice target = 1; }
  ExpertWithState state = 1;
  RdmaEndpointPair rdma_endpoints = 2;
}

service StateService {
  rpc Exchange(stream ExchangeReq) returns (stream ExchangeResp);
}
