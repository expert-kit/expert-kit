syntax = "proto3";

package ek.worker.v2;

import "ek/worker/v2/common.proto";

// ComputationService executes one physical Worker batch per unary call.
service ComputationService {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc OpenSharedMemory(OpenSharedMemoryRequest) returns (OpenSharedMemoryResponse);
  rpc ExecuteSharedMemory(ExecuteSharedMemoryRequest) returns (ExecuteSharedMemoryResponse);
  rpc CloseSharedMemory(CloseSharedMemoryRequest) returns (CloseSharedMemoryResponse);
}

// ExecuteRequest carries one fixed-top-k Worker batch as little-endian raw tensors.
message ExecuteRequest {
  uint64 instance_id = 1;
  uint32 layer_id = 2;
  uint64 topology_version = 3;

  uint32 token_count = 4;
  uint32 hidden_dim = 5;
  uint32 top_k = 6;
  ActivationDType dtype = 7;

  bytes hidden_states = 8;     // [token_count, hidden_dim], activation dtype.
  bytes expert_ids = 9;        // [token_count, top_k], signed little-endian int32.
  bytes routing_weights = 10;  // [token_count, top_k], little-endian FP32.
}

// ComputeErrorCode is stable Transport-independent recovery information.
enum ComputeErrorCode {
  COMPUTE_ERROR_CODE_UNSPECIFIED = 0;
  COMPUTE_ERROR_BUSY = 1;
  COMPUTE_ERROR_DRAINING = 2;
  COMPUTE_ERROR_STALE_TOPOLOGY = 3;
  COMPUTE_ERROR_EXPERT_NOT_READY = 4;
  COMPUTE_ERROR_INVALID_REQUEST = 5;
  COMPUTE_ERROR_UNSUPPORTED = 6;
}

// ComputeError describes a decoded request that the Worker cannot execute.
message ComputeError {
  ComputeErrorCode code = 1;
  bool retryable = 2;
  optional uint64 observed_topology_version = 3;
  optional uint64 min_topology_version = 4;
  repeated uint32 unavailable_expert_ids = 5;
  string diagnostic = 6;
}

// ExecuteResponse contains either an activation-dtype partial output or a rejection.
message ExecuteResponse {
  oneof result {
    bytes partial_output = 1;  // [token_count, hidden_dim], request activation dtype.
    ComputeError error = 2;
  }
}

// OpenSharedMemoryRequest registers fixed same-host Tensor slots.
message OpenSharedMemoryRequest {
  uint64 instance_id = 1;
  string session_id = 2;
  string segment_name = 3;
  uint64 segment_size = 4;
  uint32 slot_count = 5;
  uint32 max_batch_tokens = 6;
  uint32 hidden_dim = 7;
  uint32 top_k = 8;
  ActivationDType dtype = 9;
}

message OpenSharedMemoryResponse {}

// ExecuteSharedMemoryRequest identifies valid rows in one registered slot.
message ExecuteSharedMemoryRequest {
  string session_id = 1;
  uint32 slot_index = 2;
  uint64 generation = 3;
  uint32 layer_id = 4;
  uint64 topology_version = 5;
  uint32 token_count = 6;
  uint64 timeout_micros = 7;
}

// ExecuteSharedMemoryResponse acknowledges that the slot output is complete.
message ExecuteSharedMemoryResponse {
  oneof result {
    uint64 completed_generation = 1;
    ComputeError error = 2;
  }
}

message CloseSharedMemoryRequest {
  string session_id = 1;
}

message CloseSharedMemoryResponse {}
