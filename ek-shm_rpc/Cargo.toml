[package]
name = "ek_shm_rpc"
version = "0.1.0"
edition = "2024"

[lib]
name = "ek_shm_rpc"

[dependencies]
capnp = "0.21.0"
capnp-rpc = "0.21.0"
capnp-futures = "0.21.0"
futures = "0.3.31"
futures-util = "0.3.31"
tokio = { version = "1.45.1", features = ["full"] }
tokio-util = { version = "0.7.15", features = ["full"] }
tokio-compat = "0.1.6"
memmap2 = "0.9.5"
nix = "0.30.1"
libc = "1.0.0-alpha.1"
ctrlc = "3.4.7"
serde = { version = "1.0.219", features = ["derive"] }
bincode = "2.0.1"
rmp-serde = "1.3.0"
hex = "0.4.3"
tch = { workspace = true }
log = { workspace = true }
ek_base = { path = "../ek-base" }

[build-dependencies]
capnpc = "0.21.0"
