[project]
name = "expert-kit"
version = "0.1.0"
description = "Distributed Mixture-of-Experts inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "expertkit-proto==0.1.0",
    "expertkit-torch==0.1.0",
    "expertkit-transport==0.1.0",
    "expertkit-worker==0.1.0",
]

[project.optional-dependencies]
fused = ["expertkit-worker[fused]==0.1.0"]
ggml = ["expertkit-worker[ggml]==0.1.0"]
observability = ["expertkit-worker[observability]==0.1.0"]
vllm = ["expertkit-vllm==0.1.0"]

[dependency-groups]
dev = [
    "grpcio-tools==1.71.0",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    "safetensors>=0.5.3,<1",
]
ops = [
    "ansible>=11.5,<12",
    "ansible-lint>=25.4,<26",
]

[tool.uv.sources]
expertkit-proto = { workspace = true }
expertkit-torch = { workspace = true }
expertkit-transport = { workspace = true }
expertkit-vllm = { workspace = true }
expertkit-worker = { workspace = true }

[tool.uv.workspace]
members = [
    "ek-proto",
    "ek-transport",
    "ek-worker",
    "ek-integration/expertkit_torch",
    "ek-integration/expertkit_vllm",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = [
    "ek-proto/tests",
    "ek-transport/tests",
    "ek-worker/tests",
    "ek-integration/expertkit_torch/tests",
    "ek-integration/expertkit_vllm/tests",
]
pythonpath = ["ek-integration/expertkit_vllm"]
markers = [
    "cuda: requires an available CUDA device",
    "deepseek_v2: requires DeepSeek-V2 weights and a running Expert Kit deployment",
    "direct_io: requires a Linux filesystem supporting strict O_DIRECT reads and writes",
    "qwen: requires a supported Qwen model and a running Expert Kit deployment",
]

[tool.ruff]
exclude = ["ek-proto/src/expertkit_proto"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
