- name: Verify the Python Worker is installed
  ansible.builtin.stat:
    path: "{{ ek_worker_executable }}"
  register: ek_worker_executable_stat

- name: Reject an image without the Python Worker
  ansible.builtin.fail:
    msg: "The image must contain the locked Python Worker at {{ ek_worker_executable }}."
  when: not ek_worker_executable_stat.stat.exists

- name: Create the Worker configuration directory
  ansible.builtin.file:
    path: "{{ ek_worker_config_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Create the Worker disk-cache directory
  ansible.builtin.file:
    path: "{{ ek_worker_cache_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Render the Python Worker configuration
  ansible.builtin.template:
    src: worker.yaml.j2
    dest: "{{ ek_worker_config_path }}"
    mode: "0644"
    owner: root
    group: root
  notify: Restart Expert Kit Worker

- name: Install the Worker systemd unit
  ansible.builtin.template:
    src: expertkit-worker.service.j2
    dest: "/etc/systemd/system/{{ ek_worker_service_name }}.service"
    mode: "0644"
    owner: root
    group: root
  notify: Restart Expert Kit Worker

- name: Start the Python Worker
  ansible.builtin.systemd_service:
    name: "{{ ek_worker_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
