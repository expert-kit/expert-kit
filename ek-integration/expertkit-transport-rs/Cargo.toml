[package]
name = "expertkit-transport-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[lib]
name = "expertkit_transport_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = { workspace = true }
env_logger = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }

# gRPC dependencies (Phase 2)
tonic = "0.11"
prost = "0.12"
tower = "0.4"

# Shared memory dependencies (Phase 3)
nix = { version = "0.29", features = ["mman", "fs"] }
libc = "0.2"
dashmap = "6.0"
parking_lot = "0.12"

# Phase 4 dependencies
futures = "0.3"

# Tensor processing
safetensors = { workspace = true }
ndarray = { workspace = true }
tch = { workspace = true }

# RDMA dependencies (optional, enabled with 'rdma' feature)
ibverbs = { workspace = true, optional = true }
once_cell = "1.21.3"

[features]
default = []
rdma = ["dep:ibverbs"]

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
pyo3 = { version = "0.20", features = ["auto-initialize"] }
