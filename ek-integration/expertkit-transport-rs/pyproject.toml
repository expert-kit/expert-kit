[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "expertkit-transport"
version = "0.1.0"
description = "High-performance transport library for ExpertKit"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
]

[tool.maturin]
python-source = "python"
module-name = "expertkit_transport._lib"
