[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expertkit-torch"
version = "0.1.0"
description = "Expert Kit routed-MoE integration for Hugging Face Transformers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "expertkit-transport==0.1.0",
    "pyyaml>=6,<7",
    "torch==2.11.0",
    "pydantic>=2.12,<3",
    "tqdm>=4.67,<5",
    "typer>=0.21,<1",
    "transformers==5.5.3",
]

[project.optional-dependencies]
npu = [
    "torch-npu==2.11.0rc1",
]

[project.scripts]
ek-torch-benchmark = "expertkit_torch.benchmark.cli:main"

[tool.uv.sources]
expertkit-transport = { workspace = true }

[tool.ruff]
extend = "../../pyproject.toml"
