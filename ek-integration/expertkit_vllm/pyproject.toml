[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expertkit-vllm"
version = "0.1.0"
description = "Expert Kit routed-MoE integration for vLLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "expertkit-transport==0.1.0",
    "vllm==0.25.1",
]

[project.entry-points."vllm.general_plugins"]
register_expertkit = "expertkit_vllm.plugin:register"

[tool.uv.sources]
expertkit-transport = { workspace = true }

[tool.ruff]
extend = "../../pyproject.toml"
