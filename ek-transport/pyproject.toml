[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expertkit-transport"
version = "0.1.0"
description = "Expert Kit Routed-MoE Transport middleware"
requires-python = ">=3.12"
dependencies = [
    "expertkit-proto==0.1.0",
    "grpcio==1.71.0",
    "numpy>=2.1,<3",
    "protobuf==5.29.6",
    "torch>=2.10,<2.12",
]

[tool.uv.sources]
expertkit-proto = { workspace = true }

[tool.ruff]
extend = "../pyproject.toml"
