[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expertkit-transport"
version = "0.1.0"
description = "Expert Kit Routed-MoE Transport middleware"
requires-python = ">=3.12"
dependencies = [
    "grpcio==1.71.0",
    "numpy>=2.1,<3",
    "protobuf==5.29.4",
    "torch==2.11.0",
]

[dependency-groups]
dev = [
    "grpcio-tools==1.71.0",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["src/expertkit_transport/_proto"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
