services:
  control-image:
    image: ek-runtime:${TAG:-dev}
    build:
      context: ../../..
      dockerfile: container/Dockerfile.cpu
      target: ek-runtime
      args:
        RUST_IMAGE: docker.m.daocloud.io/library/rust:1.88.0-bookworm
        RUNTIME_IMAGE: docker.m.daocloud.io/library/debian:bookworm-slim
        UV_IMAGE: ghcr.nju.edu.cn/astral-sh/uv:0.11.30

  worker-image:
    image: ek-worker-ascend-runtime:${TAG:-dev}
    build:
      context: ../../..
      dockerfile: container/Dockerfile.npu
      target: ek-worker-ascend-runtime
      args:
        UV_IMAGE: ghcr.nju.edu.cn/astral-sh/uv:0.11.30
        UV_DEFAULT_INDEX: https://mirror.nju.edu.cn/pypi/web/simple

  attention-image:
    image: ek-vllm-ascend-runtime:${TAG:-dev}
    build:
      context: ../../..
      dockerfile: container/Dockerfile.npu
      target: ek-vllm-ascend-runtime
      args:
        # NJU mirror of the selected nightly-main-a3 digest.
        VLLM_ASCEND_IMAGE: quay.nju.edu.cn/ascend/vllm-ascend@sha256:a04db9765d8888bbec94d60e69924dc85aaa54e0702a4b68030d265f88f863f5
        UV_DEFAULT_INDEX: https://mirror.nju.edu.cn/pypi/web/simple
