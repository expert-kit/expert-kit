inference:
  hidden_dim: 16
  intermediate_dim: 8
  instance_name: local-test
  model_name: ds-tiny

db:
  db_dsn: postgres://dev:dev@localhost:5432/dev
  max_conn_size: 32

weight:
  server:
    addr: http://localhost:6543
  cache:
    Fs:
      path: /tmp/expert-kit/cache

controller:
  listen: 0.0.0.0
  broadcast: localhost
  ports:
    intra: 5001
    inter: 5002

  fault_detection:
    heartbeat_timeout_secs: 10       # seconds before a silent worker triggers recovery
    node_active_threshold_secs: 60   # seconds before a node is excluded from routing/recovery
    poller_interval_secs: 5          # placement-state polling interval

  # scaling:                  # progressive expert assignment on worker join (opt-in)
  #   auto_assign: true
  #   experts_per_step: 8
  #   step_delay_ms: 200
