inference:
  hidden_dim: 16
  intermediate_dim: 8
  instance_name: local-test
  model_name: ds-tiny

db:
  db_dsn: postgres://dev:dev@localhost:5432/dev
  max_conn_size: 32

weight:
  server:
    addr: http://localhost:6543
  wm_listen: 0.0.0.0:5005
  wm_broadcast: localhost:5005
  mem_cache_mb: 4096
  cache:
    Fs:
      path: /tmp/expert-kit/cache-b

worker:
  id: worker-b
  listen: 0.0.0.0
  broadcast: 127.0.0.1
  ports:
    main: 51235
  mem_capacity_mb: 4096
  shutdown_grace_secs: 30

controller:
  listen: 0.0.0.0
  broadcast: localhost
  ports:
    intra: 5001
    inter: 5002
  fault_detection:
    heartbeat_timeout_secs: 10
