# Extension fields
x-control-image: &control-image
  image: ek-runtime:a3
  build:
    context: ../..
    dockerfile: container/Dockerfile.cpu
    target: ek-runtime
    args:
      RUST_IMAGE: docker.m.daocloud.io/library/rust:1.88.0-bookworm
      RUNTIME_IMAGE: docker.m.daocloud.io/library/debian:bookworm-slim
      UV_IMAGE: ghcr.nju.edu.cn/astral-sh/uv:0.11.30

x-model-mount: &model-mount
  type: bind
  source: ${EK_MODEL_PATH:?set EK_MODEL_PATH}
  target: /model/${EK_MODEL_NAME:-DeepSeek-V2-Lite-Chat}
  read_only: true


services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    pull_policy: missing
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dev
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:${EK_POSTGRES_PORT:?set EK_POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - expert-kit-network

  migrations:
    <<: *control-image
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./controller.yaml:/etc/expert-kit/config.yaml:ro
    command:
      - ek-cli
      - db
      - migrate
    networks:
      - expert-kit-network

  weight-server:
    <<: *control-image
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped 
    ports:
      - "${EK_NODE_A_IP?set EK_NODE_A_IP}:${EK_WEIGHT_SERVER_PORT:-16543}:6543"
    volumes:
      - *model-mount
      - ./controller.yaml:/etc/expert-kit/config.yaml:ro
      - weight-cache:/var/cache/expert-kit/weight-cache
    environment:
      RUST_LOG: info
    command: 
      - ek-cli
      - weight-server
      - --model
      - /model/${EK_MODEL_NAME:? EK_MODEL_NAME}
    networks:
      - expert-kit-network

  model-init:
    <<: *control-image
    depends_on:
      migrations:
        condition: service_completed_successfully
      weight-server:
        condition: service_started
    volumes:
      - ./controller.yaml:/etc/expert-kit/config.yaml:ro
    environment:
      RUST_LOG: info
    command: 
      - ek-cli
      - model
      - upsert
      - --name
      - ${EK_MODEL_NAME}
    networks:
      - expert-kit-network

  controller:
    <<: *control-image
    depends_on:
      migrations:
        condition: service_completed_successfully
      model-init:
        condition: service_completed_successfully
    restart: unless-stopped 
    ports:
      - "${EK_NODE_A_IP?set EK_NODE_A_IP}:${EK_CONTROLLER_INTRA_PORT:-15001}:5001"
      - "${EK_NODE_A_IP?set EK_NODE_A_IP}:${EK_CONTROLLER_INTER_PORT:-15002}:5002"
    volumes:
      - ./controller.yaml:/etc/expert-kit/config.yaml:ro
    environment:
      RUST_LOG: info
    command: 
      - ek-cli
      - controller
    networks:
      - expert-kit-network

  admin:
    <<: *control-image
    profiles: ["tools"]
    volumes:
      - ./controller.yaml:/etc/expert-kit/config.yaml:ro
      - *model-mount
      - weight-cache:/var/cache/expert-kit/weight-cache
    networks:
      - expert-kit-network

  attention-smoke:
    profiles: ["smoke"]
    image: ek-vllm-ascend-runtime:a3
    build:
      context: ../..
      dockerfile: container/Dockerfile.npu
      target: ek-vllm-ascend-runtime
      args:
        VLLM_ASCEND_IMAGE: quay.nju.edu.cn/ascend/vllm-ascend:v0.23.0rc1-a3
        UV_IMAGE: ghcr.nju.edu.cn/astral-sh/uv:0.11.30
    privileged: true
    ipc: host
    shm_size: 16g
    depends_on:
      controller:
        condition: service_started
    environment:
      ASCEND_RT_VISIBLE_DEVICES: "0"
    volumes:
      - *model-mount
      - ./results:/results
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/Ascend/firmware:/usr/local/Ascend/firmware:ro
      - /etc/ascend_install.info:/etc/ascend_install.info:ro
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
      - /usr/local/dcmi:/usr/local/dcmi:ro
      - /dev/devmm_svm:/dev/devmm_svm
    networks:
      - expert-kit-network

# For gRPC connection
networks:
  expert-kit-network:
    driver: bridge

volumes:
  pg_data:
  weight-cache:
