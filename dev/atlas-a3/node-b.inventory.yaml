worker_count: 16
device_count: 16
worker_base_port: 51234
peer_base_port: 52234

model:
  name: DeepSeek-V2-Lite-Chat
  weight_version: main
  num_layers: 27
  experts_per_layer: 64
  hidden_dim: 2048
  expert_intermediate_dim: 768
  top_k: 8
  activation_dtype: bf16
  weight_dtype: bf16

worker:
  backend: torch
  device_start_index: 0
  device_prefix: npu
  max_batch_tokens: 4096
  max_active_batches_per_device: 1
  device_memory_limit: 20GiB
  shutdown_grace_secs: 30

transport:
  type: grpc
  max_pending_batches_per_device: 1

controller:
  heartbeat_interval_secs: 3
  heartbeat_timeout_secs: 10

weight_manager:
  max_concurrent_loads: 64
  disk_cache:
    base_path: /ek/worker_cache
    writeback: true

logging:
  level: INFO
  format: console

observability:
  prometheus:
    enabled: false
  tracing:
    enabled: false
