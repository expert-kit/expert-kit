services:
  ek-postgres:
    container_name: ek-postgres
    image: postgres:latest
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dev
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - ../../data/pg:/var/lib/postgresql/data
    networks:
      - expert-kit-network
  ek-migrations:
    build:
      context: ../../
      dockerfile: ./container/Dockerfile.cpu
      target: ek-runtime
    depends_on:
      ek-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dev:dev@ek-postgres:5432/dev
    volumes:
      - ../../ek-computation/migrations:/app/ek-migrations
    working_dir: /app/ek-migrations
    command: diesel migration run --migration-dir /app/ek-migrations
    networks:
      - expert-kit-network
  ek-weight-server:
    build:
      context: ../../
      dockerfile: ./container/Dockerfile.cpu
      target: ek-runtime
    container_name: ek-weight-server
    restart: unless-stopped 
    depends_on:
      ek-postgres:
        condition: service_healthy
    command: ["ek-cli", "weight-server", "--model", "/ek/qwen3"]
    ports:
      - 6543:6543
    volumes:
      - ./local.inventory.yaml:/ek/local.inventory.yaml
      - ./config.yaml:/etc/expert-kit/config.yaml
      - ../../data/qwen3:/ek/qwen3
    environment:
      - RUST_LOG=info
    networks:
      - expert-kit-network
  ek-controller:
    build:
      context: ../../
      dockerfile: ./container/Dockerfile.cpu
      target: ek-runtime
    container_name: ek-controller
    restart: unless-stopped 
    depends_on:
      ek-postgres:
        condition: service_healthy
    command: ["ek-cli", "controller"]
    ports:
      - 5001:5001
      - 5002:5002
    volumes:
      - ./config.yaml:/etc/expert-kit/config.yaml
      - ../../data/qwen3/ek-qwen3:/ek/qwen3
    environment:
      - RUST_LOG=info
    networks:
      - expert-kit-network
  ek-worker:
    build:
      context: ../../
      dockerfile: ./container/Dockerfile.cpu
      target: ek-worker-cuda-runtime
    container_name: ek-worker
    restart: unless-stopped
    depends_on:
      - ek-controller
    command: ["ek-cli", "--config", "/etc/expert-kit/worker.yaml", "worker"]
    ports:
      - 51234:51234
    volumes:
      - ./worker.yaml:/etc/expert-kit/worker.yaml:ro
      - ../../data/worker-cache:/ek/worker_cache
    environment:
      CUDA_VISIBLE_DEVICES: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${EK_WORKER_GPU:-0}"]
              capabilities: [gpu]
    networks:
      - expert-kit-network

networks:
  expert-kit-network:
    driver: bridge
