name: Python workspace checks

on:
  workflow_dispatch:
  pull_request:
    branches: ["dev"]
    types: [opened, synchronize, reopened]

jobs:
  workspace-lock-check:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true

      - name: Check the unified lockfile
        run: |
          uv lock --check
          test "$(git ls-files '*uv.lock')" = "uv.lock"
          test ! -e ek-integration/expertkit_vllm/setup.py

  python-check:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true

      - name: Install the locked default workspace
        run: uv sync --locked

      - name: Verify default workspace imports
        run: |
          uv run --no-sync python -c \
            "import expertkit_proto, expertkit_transport, expertkit_worker, expertkit_torch"

      - name: Regenerate and test Proto
        run: |
          uv run --no-sync python ek-proto/scripts/generate_python.py
          git diff --exit-code -- ek-proto/src
          uv run --no-sync --package expertkit-proto ruff check \
            ek-proto/scripts ek-proto/tests
          uv run --no-sync --package expertkit-proto ruff format --check \
            ek-proto/scripts ek-proto/tests
          uv run --no-sync --package expertkit-proto pytest ek-proto/tests

      - name: Check Transport
        run: |
          uv run --no-sync --package expertkit-transport ruff check \
            ek-transport/src ek-transport/tests
          uv run --no-sync --package expertkit-transport ruff format --check \
            ek-transport/src ek-transport/tests
          uv run --no-sync --package expertkit-transport pytest ek-transport/tests

      - name: Check Worker
        run: |
          uv run --no-sync --package expertkit-worker ruff check \
            ek-worker/src ek-worker/tests
          uv run --no-sync --package expertkit-worker ruff format --check \
            ek-worker/src ek-worker/tests
          uv run --no-sync --package expertkit-worker pytest ek-worker/tests

      - name: Check Torch integration
        run: |
          uv run --no-sync --package expertkit-torch ruff check \
            ek-integration/expertkit_torch/expertkit_torch \
            ek-integration/expertkit_torch/tests
          uv run --no-sync --package expertkit-torch ruff format --check \
            ek-integration/expertkit_torch/expertkit_torch \
            ek-integration/expertkit_torch/tests
          uv run --no-sync --package expertkit-torch pytest \
            ek-integration/expertkit_torch/tests

      - name: Check and build vLLM integration without its runtime
        env:
          PYTHONPATH: ek-integration/expertkit_vllm
        run: |
          uv run --no-sync ruff check \
            ek-integration/expertkit_vllm/expertkit_vllm \
            ek-integration/expertkit_vllm/tests
          uv run --no-sync ruff format --check \
            ek-integration/expertkit_vllm/expertkit_vllm \
            ek-integration/expertkit_vllm/tests
          uv run --no-sync pytest ek-integration/expertkit_vllm/tests
          uv run --no-sync python -c "from expertkit_vllm import plugin; assert callable(plugin.register)"
          uv build --package expertkit-vllm --wheel --out-dir /tmp/expertkit-vllm-wheel
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("/tmp/expertkit-vllm-wheel").glob("*.whl"))
          with ZipFile(wheel) as archive:
              entry_points = next(
                  name for name in archive.namelist() if name.endswith("entry_points.txt")
              )
              contents = archive.read(entry_points).decode()
          assert "[vllm.general_plugins]" in contents
          assert "register_expertkit = expertkit_vllm.plugin:register" in contents
          PY

  worker-optional-check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: fused
            import_check: import triton; import expertkit_worker.backends.fused
            tests: ek-worker/tests/unit/backends/fused ek-worker/tests/unit/config/test_models.py
          - extra: ggml
            import_check: import ggml
            tests: ek-worker/tests/unit/backends/ggml ek-worker/tests/unit/test_factory.py
          - extra: observability
            import_check: import opentelemetry.sdk, prometheus_client
            tests: ek-worker/tests/integration/observability

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true

      - name: Install the locked optional environment
        run: uv sync --locked --extra "${{ matrix.extra }}"

      - name: Verify the optional dependency is installed
        run: uv run --no-sync python -c "${{ matrix.import_check }}"

      - name: Run optional-profile tests
        run: uv run --no-sync pytest ${{ matrix.tests }}

  local-compose-check:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build the CUDA Worker image target
        run: |
          docker build \
            --target ek-worker-cuda-runtime \
            --file container/Dockerfile.cpu \
            .

      - name: Validate local Compose GPU reservation
        run: |
          for compose_file in compose.yaml compose.build.yaml; do
            docker compose \
              -f "dev/local-example/${compose_file}" \
              config --format json > "/tmp/${compose_file}.json"
            python3 - "/tmp/${compose_file}.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              worker = json.load(source)["services"]["ek-worker"]
          devices = (
              worker.get("deploy", {})
              .get("resources", {})
              .get("reservations", {})
              .get("devices", [])
          )
          assert any("gpu" in device.get("capabilities", []) for device in devices)
          assert worker["environment"]["CUDA_VISIBLE_DEVICES"] == "0"
          PY
          done
