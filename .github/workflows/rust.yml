name: Rust checks

on:
  workflow_dispatch:
  pull_request:
    branches: ["dev"]
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install PostgreSQL development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true

      - name: Install the locked Python Worker
        run: uv sync --locked --package expertkit-worker

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run Python Worker recovery tests
        run: cargo test -p ek-computation --test v2_worker_recovery --locked -- --ignored

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
