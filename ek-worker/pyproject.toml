[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expertkit-worker"
version = "0.1.0"
description = "Expert Kit Python Worker"
requires-python = ">=3.12"
dependencies = [
    "expertkit-transport",
    "pydantic>=2.11,<3",
    "PyYAML>=6,<7",
    "structlog>=25.4,<26",
    "torch==2.11.0",
]

[tool.uv.sources]
expertkit-transport = { path = "../ek-transport", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    "safetensors>=0.5.3,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "direct_io: requires a Linux filesystem supporting strict O_DIRECT reads and writes",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
