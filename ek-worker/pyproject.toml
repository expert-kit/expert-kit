[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expertkit-worker"
version = "0.1.0"
description = "Expert Kit Python Worker"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11,<4",
    "expertkit-proto==0.1.0",
    "expertkit-transport==0.1.0",
    "grpcio==1.71.0",
    "pydantic>=2.12,<3",
    "PyYAML>=6,<7",
    "structlog>=25.4,<26",
    "torch==2.11.0",
]

[project.scripts]
ek-worker = "expertkit_worker.cli:main"

[project.optional-dependencies]
fused = [
    "triton==3.6.0",
]
ggml = [
    "ggml-python==0.0.45",
]
observability = [
    "opentelemetry-exporter-otlp-proto-grpc==1.39.1",
    "opentelemetry-instrumentation-grpc==0.60b1",
    "opentelemetry-sdk==1.39.1",
    "prometheus-client==0.25.0",
]
npu = [
  "torch-npu==2.11.0rc1",
]

[tool.uv.sources]
expertkit-proto = { workspace = true }
expertkit-transport = { workspace = true }

[dependency-groups]
dev = ["safetensors>=0.5.3,<1"]

[tool.ruff]
extend = "../pyproject.toml"
