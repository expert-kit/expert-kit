[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expertkit-worker"
version = "0.1.0"
description = "Expert Kit Python Worker"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
    "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
